<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" role="img" aria-labelledby="life-title life-desc">
  <title id="life-title">Payment lifecycle</title>
  <desc id="life-desc">A payment moves from initiated to processing on the provider call, to authorized when the bank approves, to captured on capture, and to settled when the payout clears. Initiated can time out to expired, processing can be declined to failed, authorized can be voided to cancelled, and captured can be refunded. Capture is the point of no return.</desc>
  <defs>
    <marker id="st-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6B7280"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 19px; font-weight: 600; fill: #1F2937; }
      .subtitle { font-size: 14px; fill: #6B7280; }
      .name  { font-size: 16px; font-weight: 600; fill: #1F2937; text-anchor: middle; }
      .label { font-size: 13px; fill: #4B5563; }
      .box   { fill: #FFFFFF; stroke: #9CA3AF; stroke-width: 1.5; }
      .key   { fill: #EAF1FB; stroke: #1E5AA8; stroke-width: 2.5; }
      .edge  { fill: none; stroke: #6B7280; stroke-width: 1.6; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="371" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>

  <text class="title" x="30" y="44">Capture is the point of no return</text>
  <text class="subtitle" x="30" y="68">Payment states, and the event that moves a payment between them</text>


  <!-- connectors -->
  <path class="edge" d="M180 155H215" marker-end="url(#st-arrow)"/>
  <path class="edge" d="M367 155H402" marker-end="url(#st-arrow)"/>
  <path class="edge" d="M555 155H590" marker-end="url(#st-arrow)"/>
  <path class="edge" d="M742 155H777" marker-end="url(#st-arrow)"/>
  <path class="edge" d="M105 182V275" marker-end="url(#st-arrow)"/>
  <path class="edge" d="M292 182V275" marker-end="url(#st-arrow)"/>
  <path class="edge" d="M480 182V275" marker-end="url(#st-arrow)"/>
  <path class="edge" d="M667 182V275" marker-end="url(#st-arrow)"/>

  <!-- transition labels: above the row, centred on each gap -->
  <text class="label" x="199" y="118" text-anchor="middle">provider call</text>
  <text class="label" x="386" y="118" text-anchor="middle">bank approves</text>
  <text class="label" x="573" y="118" text-anchor="middle">capture</text>
  <text class="label" x="761" y="118" text-anchor="middle">payout clears</text>
  <text class="label" x="115" y="234">timeout</text>
  <text class="label" x="302" y="234">declined</text>
  <text class="label" x="490" y="234">hold voided</text>
  <text class="label" x="677" y="234">refund</text>

  <!-- happy path -->
  <rect class="box" x="30"  y="128" width="150" height="54" rx="10"/><text class="name" x="105" y="161">Initiated</text>
  <rect class="box" x="217" y="128" width="150" height="54" rx="10"/><text class="name" x="292" y="161">Processing</text>
  <rect class="box" x="405" y="128" width="150" height="54" rx="10"/><text class="name" x="480" y="161">Authorized</text>
  <rect class="key" x="592" y="128" width="150" height="54" rx="10"/><text class="name" x="667" y="161">Captured</text>
  <rect class="box" x="780" y="128" width="150" height="54" rx="10"/><text class="name" x="855" y="161">Settled</text>

  <!-- terminal states -->
  <rect class="box" x="30"  y="278" width="150" height="54" rx="10"/><text class="name" x="105" y="311">Expired</text>
  <rect class="box" x="217" y="278" width="150" height="54" rx="10"/><text class="name" x="292" y="311">Failed</text>
  <rect class="box" x="405" y="278" width="150" height="54" rx="10"/><text class="name" x="480" y="311">Cancelled</text>
  <rect class="box" x="592" y="278" width="150" height="54" rx="10"/><text class="name" x="667" y="311">Refunded</text>
</svg>
